[pytest]
# The audit workspace contains enrolled repositories and copied target projects
# under data/repos/ and data/e2e_targets/.  Their application tests are inputs
# to Lotus, not Lotus's own test suite; recursive discovery made duplicate
# ``tests.*`` modules collide and could execute untrusted target code on the
# host.  Keep platform regression tests explicit and deterministic.
testpaths = backend/tests
norecursedirs = .git .venv data/repos data/e2e_targets/jc data/e2e_targets/sandbox/examples
addopts = --strict-markers
