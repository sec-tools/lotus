apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lotus-image-builder
  namespace: lotus-build
# Optional image building can create root-capable workloads in this dedicated
# baseline namespace. Keep it separate from restricted lab Jobs and never bind
# this Role to a build pod's tokenless default service account.
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lotus-image-builder
  namespace: lotus-build
subjects:
  - kind: ServiceAccount
    name: lotus-lab-runner
    namespace: lotus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lotus-image-builder
