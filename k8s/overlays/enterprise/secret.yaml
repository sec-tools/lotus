# Replace the placeholder values before apply:
#   kubectl create secret generic lotus-enterprise -n lotus \
#     --from-literal=postgres-user=lotus \
#     --from-literal=postgres-password='CHANGE_ME' \
#     --from-literal=auth-token='CHANGE_ME' \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: lotus-enterprise
  namespace: lotus
type: Opaque
stringData:
  postgres-user: lotus
  postgres-password: CHANGE_ME
  auth-token: CHANGE_ME
  database-url: postgresql://lotus:CHANGE_ME@lotus-postgres:5432/lotus
