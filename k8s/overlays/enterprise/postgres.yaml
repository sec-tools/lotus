apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lotus-pgdata
  namespace: lotus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lotus-postgres
  namespace: lotus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lotus-postgres
  template:
    metadata:
      labels:
        app: lotus-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lotus-enterprise
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lotus-enterprise
                  key: postgres-password
            - name: POSTGRES_DB
              value: lotus
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "lotus"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: lotus-pgdata
---
apiVersion: v1
kind: Service
metadata:
  name: lotus-postgres
  namespace: lotus
spec:
  selector:
    app: lotus-postgres
  ports:
    - port: 5432
      targetPort: 5432
