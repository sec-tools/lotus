apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lotus
# Keep the reusable base below the overlay directory. The former enterprise
# overlay referenced ../../ (the kustomization that owned the overlay), which
# made kustomize detect a recursive resource cycle.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - controller-kubeconfig.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
