apiVersion: v1
kind: ServiceAccount
metadata:
  name: lotus
  namespace: lotus
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lotus-lab-runner
  namespace: lotus
# The controller explicitly mounts a rotating projected token; tokenless Jobs
# cannot acquire this identity through a service-account default.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
# Namespace-scoped controller permissions. Kubernetes RBAC cannot enforce
# label selectors; the provider separately checks per-audit resource identity.
# This role grants no Secret access, RBAC administration, or cluster scope.
kind: Role
metadata:
  name: lotus-lab-runner
  namespace: lotus
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "patch", "delete", "watch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["create", "get", "list", "patch", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Read scheduling/startup diagnostics; the runtime filters by resource UID.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Controller-owned HTTP observations bind the exact registered Pod UID.
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create", "get"]
  # Source and reusable compiler cache volumes for one-shot tool Jobs.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "patch", "delete"]
  # Read admission ceilings; writes still target only Lotus governance objects.
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas"]
    verbs: ["get", "list"]
  # Governance creates its own objects; later writes are restricted to their
  # fixed names so the controller cannot edit operator-managed quota objects.
  - apiGroups: [""]
    resources: ["limitranges", "resourcequotas"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["limitranges"]
    resourceNames: ["lotus-defaults"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["resourcequotas"]
    resourceNames: ["lotus-compute"]
    verbs: ["get", "patch"]
  # Identity capture must inspect every additive policy selected by its Pod;
  # reading only its own named policy cannot establish the egress boundary.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lotus-lab-runner
  namespace: lotus
subjects:
  - kind: ServiceAccount
    name: lotus-lab-runner
    namespace: lotus
roleRef:
  kind: Role
  name: lotus-lab-runner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lotus-capacity-reader
rules:
  # Capacity inventory only. No node proxy, metrics, secrets or writes.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lotus-capacity-reader
subjects:
  - kind: ServiceAccount
    name: lotus-lab-runner
    namespace: lotus
roleRef:
  kind: ClusterRole
  name: lotus-capacity-reader
  apiGroup: rbac.authorization.k8s.io
