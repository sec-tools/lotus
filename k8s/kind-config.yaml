# Fresh owned cluster. Use scripts/bootstrap_kind.py to install pinned Calico
# and verify traffic before deploying Lotus. A raw kind create has no CNI.
# Existing clusters are never reconfigured; access Lotus through port-forward.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.240.0/20
  serviceSubnet: 10.120.0.0/16
  apiServerAddress: 127.0.0.1
nodes:
  - role: control-plane
